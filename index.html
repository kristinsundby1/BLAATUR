<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLÅTUR 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F7D9E6;
    --paper-line: #E6B9CE;
    --ink: #3B1F2B;
    --ink-soft: #7A5A66;
    --pine: #2F6E5B;
    --rust: #B5502E;
    --gold: #C7963A;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 20px 40px;
  }

  .frame {
    width: 100%;
    max-width: 1320px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
    justify-content: center;
  }

  header {
    text-align: left;
    order: 1;
  }

  .trip-name {
    font-family: 'Fraunces', serif;
    font-size: 44px;
    font-weight: 600;
    line-height: 1.1;
    margin: 0 0 8px;
    letter-spacing: 0.01em;
  }

  .trip-dates {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

.trip-hint {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--rust);
    margin-top: 24px;
}

  main {
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    order: 2;
  }

  .tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
  }

  .tab {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    background: transparent;
    border: 1px solid var(--paper-line);
    border-bottom: none;
    border-radius: 10px 10px 0 0;
    padding: 10px 18px;
    color: var(--ink-soft);
    cursor: pointer;
    white-space: nowrap;
    transition: color 0.2s, background 0.2s;
  }

  .tab.active {
    background: #fff;
    color: var(--pine);
    font-weight: 500;
  }

  .card {
    background: #fff;
    border: 1px solid var(--paper-line);
    border-radius: 0 10px 10px 10px;
    padding: 28px 28px 8px;
    position: relative;
  }

  .day-heading {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--rust);
    margin: 0 0 4px;
  }

  .day-date {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    margin: 0 0 24px;
    color: var(--ink);
  }

  .stop {
    display: grid;
    grid-template-columns: 68px 1fr;
    gap: 16px;
    padding: 14px 0;
    border-bottom: 1px solid var(--paper-line);
  }

  .stop:last-child { border-bottom: none; }

  .stop-time {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    color: var(--pine);
    padding-top: 2px;
  }

  .stop-body .activity {
    font-weight: 500;
    margin: 0 0 2px;
  }

  .stop-body .place {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0;
  }

  footer {
    margin-top: 28px;
    font-size: 13px;
    color: var(--ink-soft);
  }

  footer code {
    background: var(--paper-line);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'IBM Plex Mono', monospace;
  }

  /* Bilde-collage: mobil-først som en enkel rutenett-rad, blir en ramme rundt programmet på brede skjermer */
  .photos {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }

  .photo-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    order: 3;
  }

  .photo {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #fff;
    border: 1px solid var(--paper-line);
    box-shadow: 0 4px 10px rgba(59, 31, 43, 0.1);
    padding: 8px 8px 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    text-align: center;
    overflow: hidden;
  }

  .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .photo:empty::before {
    content: attr(data-label);
  }

  .photo-caption {
    margin: 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    text-align: center;
  }

  .photo-modal-box {
    background: #fff;
    border: 1px solid var(--paper-line);
    border-radius: 14px;
    padding: 20px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 12px 30px rgba(59, 31, 43, 0.3);
    animation: pop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .photo-modal-box .photo {
    width: 100%;
    height: 320px;
    margin-bottom: 20px;
    font-size: 15px;
  }

  .photo-modal-box .photo-caption {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 20px;
  }

  .photo-item:nth-child(odd) .photo { transform: rotate(-2deg); }
  .photo-item:nth-child(even) .photo { transform: rotate(2deg); }

  @media (min-width: 980px) {
    .frame {
      grid-template-columns: 240px 1fr 240px;
      grid-template-areas:
        "p1   header p6"
        "p2   main   p7"
        "p3   main   p8"
        "p4   main   p9"
        "p5   main   p10";
      align-items: start;
      column-gap: 48px;
      row-gap: 22px;
    }
    header { grid-area: header; }
    main { grid-area: main; margin: 0; }
    .photos { display: contents; }
    .photo-item {
      width: 160px;
      justify-self: start;
    }
    .photo {
      aspect-ratio: 1 / 1;
      height: auto;
    }
    .photo-item:nth-of-type(1) { grid-area: p1; margin-left: 4px; }
    .photo-item:nth-of-type(2) { grid-area: p2; margin-left: 58px; }
    .photo-item:nth-of-type(3) { grid-area: p3; margin-left: 18px; }
    .photo-item:nth-of-type(4) { grid-area: p4; margin-left: 50px; }
    .photo-item:nth-of-type(5) { grid-area: p5; margin-left: 10px; }
    .photo-item:nth-of-type(6) { grid-area: p6; margin-left: 34px; }
    .photo-item:nth-of-type(7) { grid-area: p7; margin-left: 4px; }
    .photo-item:nth-of-type(8) { grid-area: p8; margin-left: 56px; }
    .photo-item:nth-of-type(9) { grid-area: p9; margin-left: 14px; }
    .photo-item:nth-of-type(10) { grid-area: p10; margin-left: 44px; }

    .photo-item:nth-of-type(1) .photo { transform: rotate(-3deg); }
    .photo-item:nth-of-type(2) .photo { transform: rotate(2deg); }
    .photo-item:nth-of-type(3) .photo { transform: rotate(-2deg); }
    .photo-item:nth-of-type(4) .photo { transform: rotate(3deg); }
    .photo-item:nth-of-type(5) .photo { transform: rotate(-1deg); }
    .photo-item:nth-of-type(6) .photo { transform: rotate(2deg); }
    .photo-item:nth-of-type(7) .photo { transform: rotate(-3deg); }
    .photo-item:nth-of-type(8) .photo { transform: rotate(1deg); }
    .photo-item:nth-of-type(9) .photo { transform: rotate(-2deg); }
    .photo-item:nth-of-type(10) .photo { transform: rotate(3deg); }
  }

  @media (prefers-reduced-motion: no-preference) {
    .card { animation: fadeIn 0.25s ease; }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(59, 31, 43, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 10;
  }

  .modal-box {
    background: #fff;
    border: 3px solid var(--rust);
    border-radius: 18px;
    padding: 40px 32px;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 12px 30px rgba(59, 31, 43, 0.3);
    animation: pop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .modal-box p {
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 600;
    line-height: 1.3;
    margin: 0 0 20px;
    color: var(--rust);
  }

  .modal-close {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    background: var(--paper);
    border: 1px solid var(--paper-line);
    border-radius: 8px;
    padding: 8px 16px;
    color: var(--ink);
    cursor: pointer;
  }

  @keyframes pop {
    from { opacity: 0; transform: scale(0.85); }
    to { opacity: 1; transform: scale(1); }
  }

  .cats-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 32px;
    margin-top: 44px;
  }

  .cat-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 84px;
  }

  .cat-item svg {

  }

  .cat-name {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--ink);
  }
</style>
</head>

<script>
  // REDIGER HER: legg til/fjern dager og stopp i denne listen
  const tripData = [
    {
      label: "Fredag",
      date: "Fredag 18. september",
      stops: [
        { time: "14:15", activity: "OPPMØTE", place: "KASTRUP" },
        { time: "14:45", activity: "OPPMØTE", place: "GARDERMOEN" },
      ],
    },
    {
      label: "Lørdag",
      date: "Lørdag 19. september",
      secret: "HAHA! DU TRODDE AT DU SKULLE FÅ VITE NOE???",
    },
    {
      label: "Søndag",
      date: "Søndag 20. september",
      secret: "DU ER EN LETTLURT KATTEPUS! DET ER HEMMELIIIIIIG",
    },
  ];

  const tabsEl = document.getElementById("tabs");
  const cardEl = document.getElementById("card");
  let activeIndex = 0;

  function renderTabs() {
    tabsEl.innerHTML = "";
    tripData.forEach((day, i) => {
      const btn = document.createElement("button");
      btn.className = "tab" + (i === activeIndex ? " active" : "");
      btn.textContent = day.label;
      btn.onclick = () => {
        activeIndex = i;
        renderTabs();
        renderCard();
        if (day.secret) showSecretModal(day.secret);
      };
      tabsEl.appendChild(btn);
    });
  }

  function renderCard() {
    const day = tripData[activeIndex];
    cardEl.innerHTML = "";
    cardEl.classList.remove("card");
    void cardEl.offsetWidth;
    cardEl.classList.add("card");

    const heading = document.createElement("p");
    heading.className = "day-heading";
    heading.textContent = day.label.toUpperCase();
    cardEl.appendChild(heading);

    const date = document.createElement("p");
    date.className = "day-date";
    date.textContent = day.date;
    cardEl.appendChild(date);

    (day.stops || []).forEach(stop => {
      const row = document.createElement("div");
      row.className = "stop";

      const time = document.createElement("div");
      time.className = "stop-time";
      time.textContent = stop.time;

      const body = document.createElement("div");
      body.className = "stop-body";
      const activity = document.createElement("p");
      activity.className = "activity";
      activity.textContent = stop.activity;
      const place = document.createElement("p");
      place.className = "place";
      place.textContent = stop.place;
      body.appendChild(activity);
      body.appendChild(place);

      row.appendChild(time);
      row.appendChild(body);
      cardEl.appendChild(row);
    });
  }

  function showSecretModal(message) {
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";

    const box = document.createElement("div");
    box.className = "modal-box";

    const text = document.createElement("p");
    text.textContent = message;

    const closeBtn = document.createElement("button");
    closeBtn.className = "modal-close";
    closeBtn.textContent = "Skjønner";
    closeBtn.onclick = () => backdrop.remove();

    box.appendChild(text);
    box.appendChild(closeBtn);
    backdrop.appendChild(box);
    backdrop.onclick = (e) => { if (e.target === backdrop) backdrop.remove(); };

    document.body.appendChild(backdrop);
  }

  function showPhotoModal(imgSrc, imgAlt, caption) {
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";

    const box = document.createElement("div");
    box.className = "photo-modal-box";

    const photo = document.createElement("div");
    photo.className = "photo";
    const img = document.createElement("img");
    img.src = imgSrc;
    img.alt = imgAlt;
    photo.appendChild(img);

    const captionEl = document.createElement("p");
    captionEl.className = "photo-caption";
    captionEl.textContent = caption;

    const closeBtn = document.createElement("button");
    closeBtn.className = "modal-close";
    closeBtn.textContent = "Lukk";
    closeBtn.onclick = () => backdrop.remove();

    box.appendChild(photo);
    box.appendChild(captionEl);
    box.appendChild(closeBtn);
    backdrop.appendChild(box);
    backdrop.onclick = (e) => { if (e.target === backdrop) backdrop.remove(); };

    document.body.appendChild(backdrop);
  }

  document.querySelectorAll(".photo-item").forEach(item => {
    const img = item.querySelector(".photo img");
    const caption = item.getAttribute("data-caption");
    item.addEventListener("click", () => showPhotoModal(img.src, img.alt, caption));
  });

  renderTabs();
  renderCard();
</script>
</body>
</html>
